name: macOS Automated Remote Worker

on:
  workflow_dispatch:
    inputs:
      user_password:
        description: 'Password Akun macOS & RustDesk (macuser)'
        required: true
        default: 'macOS123'
      session_hours:
        description: 'Durasi Sesi (Jam, Maksimal 6)'
        required: true
        default: '6'

jobs:
  macos-desktop-session:
    runs-on: macos-15 # macOS 15 Sequoia (Apple Silicon Arm64), 3 vCPU, 7 GB RAM
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Mask Sensitive Input
        run: |
          # Sensor password agar tidak pernah muncul di log publik GitHub Actions
          echo "::add-mask::${{ github.event.inputs.user_password }}"

      - name: Setup Tailscale Native Daemon (TUN Mode)
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e
          echo "=== 1. Menginstal & Menjalankan Tailscale Native Daemon ==="
          brew install tailscale
          
          # Jalankan daemon tailscaled sebagai root dengan mode TUN (bukan userspace)
          sudo /opt/homebrew/bin/tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          
          # Autentikasi node ke Tailnet
          sudo /opt/homebrew/bin/tailscale up \
            --authkey="${TS_AUTHKEY}" \
            --hostname="gh-mac-worker" \
            --accept-routes \
            --ssh
          
          sleep 3
          NODE_IP=$(/opt/homebrew/bin/tailscale ip -4 | head -n1)
          echo "TAILSCALE_IP=$NODE_IP" >> $GITHUB_ENV
          echo "Tailscale terhubung dengan IP: $NODE_IP"

      - name: Provision Dedicated Admin User (Bypass eDSAuthFailed)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          set -e
          echo "=== 2. Membuat Akun Admin Baru: macuser ==="
          # sysadminctl tidak memerlukan password lama runner bawaan
          sudo sysadminctl -addUser macuser -fullName "Mac Admin" -password "${USER_PASS}" -admin
          
          # Berikan izin sudo tanpa password
          echo "macuser ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/macuser
          
          # Aktifkan Remote Login (SSH)
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          sudo dseditgroup -o edit -a macuser -t user com.apple.access_ssh 2>/dev/null || true
          sudo dseditgroup -o edit -a runner -t user com.apple.access_ssh 2>/dev/null || true

      - name: Unlock macOS Login Keychain & Pre-authorize Developer Tools
        run: |
          set -e
          echo "=== 3. Membuka Kunci Login Keychain untuk Tool Developer (xcodebuild/git) ==="
          sudo python3 -c "
          key = [125, 137, 82, 35, 210, 188, 221, 234, 163, 185, 31]
          data = open('/etc/kcpassword', 'rb').read()
          pw = bytes([b ^ key[i % len(key)] for i, b in enumerate(data)]).split(b'\x00')[0].decode('utf-8')
          import subprocess
          kc = '/Users/runner/Library/Keychains/login.keychain-db'
          subprocess.run(['security', 'set-keychain-settings', '-lut', '21600', kc], check=False)
          subprocess.run(['security', 'unlock-keychain', '-p', pw, kc], check=False)
          subprocess.run(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:,git-credential-osxkeychain:,xcodebuild:', '-s', '-k', pw, kc], check=False)
          print('Login keychain unlocked and pre-authorized.')
          "

          # Kompilasi native Swift daemon untuk menangani modal SecurityAgent (macOS 15 Sequoia AXFocusedWindow)
          cat << 'EOF' > /tmp/auto_approve.swift
          import ApplicationServices
          import Foundation

          func getPassword() -> String? {
              let key: [UInt8] = [125, 137, 82, 35, 210, 188, 221, 234, 163, 185, 31]
              guard let data = try? Data(contentsOf: URL(fileURLWithPath: "/etc/kcpassword")) else { return nil }
              var decrypted = [UInt8]()
              for (i, b) in data.enumerated() {
                  decrypted.append(b ^ key[i % key.count])
              }
              if let nullIdx = decrypted.firstIndex(of: 0) {
                  decrypted = Array(decrypted[0..<nullIdx])
              }
              return String(bytes: decrypted, encoding: .utf8)
          }

          func approveSecurityAgent() {
              guard let list = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as? [[String: Any]] else { return }
              var securityAgentPid: pid_t?
              for win in list {
                  if let name = win[kCGWindowOwnerName as String] as? String, name == "SecurityAgent",
                     let pid = win[kCGWindowOwnerPID as String] as? pid_t {
                      securityAgentPid = pid
                      break
                  }
              }
              guard let pid = securityAgentPid else { return }
              guard let pw = getPassword() else { return }

              let appRef = AXUIElementCreateApplication(pid)
              var focusedWin: CFTypeRef?
              guard AXUIElementCopyAttributeValue(appRef, kAXFocusedWindowAttribute as CFString, &focusedWin) == .success,
                    let winRef = focusedWin else { return }

              let axWin = winRef as! AXUIElement
              var children: CFTypeRef?
              guard AXUIElementCopyAttributeValue(axWin, kAXChildrenAttribute as CFString, &children) == .success,
                    let childList = children as? [AXUIElement] else { return }

              var textField: AXUIElement?
              var alwaysAllowButton: AXUIElement?
              var allowButton: AXUIElement?

              for c in childList {
                  var role: CFTypeRef?
                  var title: CFTypeRef?
                  AXUIElementCopyAttributeValue(c, kAXRoleAttribute as CFString, &role)
                  AXUIElementCopyAttributeValue(c, kAXTitleAttribute as CFString, &title)
                  let roleStr = role as? String ?? ""
                  let titleStr = title as? String ?? ""
                  
                  if roleStr == "AXTextField" {
                      textField = c
                  } else if roleStr == "AXButton" {
                      if titleStr == "Always Allow" {
                          alwaysAllowButton = c
                      } else if titleStr == "Allow" {
                          allowButton = c
                      }
                  }
              }

              if let tf = textField {
                  _ = AXUIElementSetAttributeValue(tf, kAXValueAttribute as CFString, pw as CFTypeRef)
              }

              if let btn = alwaysAllowButton ?? allowButton {
                  _ = AXUIElementPerformAction(btn, kAXPressAction as CFString)
                  print("[\(Date())] Programmatically auto-approved SecurityAgent prompt!")
              }
          }

          approveSecurityAgent()
          EOF
          sudo swiftc -O /tmp/auto_approve.swift -o /usr/local/bin/auto-approve-keychain
          sudo chmod 755 /usr/local/bin/auto-approve-keychain
          rm -f /tmp/auto_approve.swift

          # Jalankan background watcher loop (polling tiap 2 detik)
          nohup bash -c '
          while true; do
              /usr/local/bin/auto-approve-keychain 2>/dev/null || true
              sleep 2
          done
          ' >/dev/null 2>&1 &
          echo "Native auto-approve keychain daemon aktif di background."

      - name: Configure Screen Sharing & ARD Engine
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          set -e
          echo "=== 4. Mengaktifkan Apple Remote Desktop (ARD) ==="
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          
          # Konfigurasi ARDAgent untuk akses semua admin user
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers \
            -privs -all \
            -restart -agent

      - name: Inject TCC Permissions (Fix Black Screen & Input Block)
        run: |
          set -e
          echo "=== 4. Bypass TCC Security Boundary (SIP Disabled) ==="
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          
          # Daftarkan izin ScreenCapture, PostEvent, dan Accessibility ke TCC.db sistem
          sudo sqlite3 "$TCC_DB" "
          INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.screensharing.daemon',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','/System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','com.apple.screensharing.daemon',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','/System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.screensharing.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.screensharing.daemon',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','/System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          
          INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.carriez.rustdesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.carriez.rustdesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceListenEvent','com.carriez.rustdesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','com.carriez.rustdesk',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0);
          "
          
          # Restart tccd agar perubahan tabel langsung efektif
          sudo killall tccd 2>/dev/null || true

      - name: Suppress Setup Assistant Modal (Fix Button Unresponsive)
        run: |
          set -e
          echo "=== 5. Mematikan Onboarding Setup Assistant (MiniBuddy) ==="
          for U in runner macuser; do
            sudo -u $U defaults write com.apple.SetupAssistant DidSeeAccessibility -bool true
            sudo -u $U defaults write com.apple.SetupAssistant DidSeeAppearanceSetup -bool true
            sudo -u $U defaults write com.apple.SetupAssistant DidSeeSiriSetup -bool true
            sudo -u $U defaults write com.apple.SetupAssistant DidSeePrivacy -bool true
            sudo -u $U defaults write com.apple.SetupAssistant DidSeeTrueTone -bool true
            sudo -u $U defaults write com.apple.SetupAssistant DidSeeTouchIDSetup -bool true
            sudo -u $U defaults write com.apple.SetupAssistant DidSeeScreenTime -bool true
            sudo -u $U defaults write com.apple.SetupAssistant DidSeeSyncSetup -bool true
            sudo -u $U defaults write com.apple.SetupAssistant MiniBuddyLaunchedPostMigration -bool true
          done
          sudo killall -9 'Setup Assistant' 2>/dev/null || true

      - name: Display & Performance Optimization
        run: |
          echo "=== 6. Optimasi Display & Pencegahan Sleep ==="
          # Matikan sleep display & disk
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 2>/dev/null || true
          caffeinate -dimsu -t 21600 &
          caffeinate -u -t 2 || true
          
          # Matikan animasi berat macOS untuk memangkas latency visual
          for U in runner macuser; do
            sudo -u $U defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
            sudo -u $U defaults write NSGlobalDomain NSWindowResizeTime -float 0.001
            sudo -u $U defaults write com.apple.universalaccess reduceTransparency -bool true
            sudo -u $U defaults write com.apple.dock launchanim -bool false
          done

      - name: Deploy & Patch noVNC Web Interface (Fallback)
        run: |
          set -e
          echo "=== 7. Menyiapkan noVNC Fallback ==="
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc
          git clone --depth 1 https://github.com/novnc/websockify.git /tmp/novnc/utils/websockify
          pip3 install numpy 2>/dev/null || true
          
          # Patch core/rfb.js agar memprioritaskan autentikasi ARD Tipe 30 (User+Pass macOS)
          python3 -c "
          with open('/tmp/novnc/core/rfb.js', 'r') as f:
              c = f.read()
          old = '''            this._rfbAuthScheme = -1;
                      for (let type of types) {
                          if (this._isSupportedSecurityType(type)) {
                              this._rfbAuthScheme = type;
                              break;
                          }
                      }'''
          new = '''            this._rfbAuthScheme = -1;
                      if (types.includes(securityTypeARD)) {
                          this._rfbAuthScheme = securityTypeARD;
                      } else {
                          for (let type of types) {
                              if (this._isSupportedSecurityType(type)) {
                                  this._rfbAuthScheme = type;
                                  break;
                              }
                          }
                      }'''
          if old in c:
              c = c.replace(old, new, 1)
              with open('/tmp/novnc/core/rfb.js', 'w') as f:
                  f.write(c)
              print('rfb.js patched: ARD Preferred')
          "
          
          # Set local cursor (show_dot) aktif secara default
          sed -i '' "s/UI.initSetting('show_dot', false);/UI.initSetting('show_dot', true);/" /tmp/novnc/app/ui.js
          
          # Jalankan novnc_proxy di port 6080
          nohup /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > /tmp/novnc.log 2>&1 &
          sleep 3

      - name: Deploy & Configure RustDesk (High-FPS Video Streaming)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          set -e
          echo "=== 8. Mengunduh dan Memasang RustDesk (Apple Silicon Arm64) ==="
          LATEST_URL=$(curl -sL https://api.github.com/repos/rustdesk/rustdesk/releases/latest | grep "browser_download_url.*aarch64\.dmg" | cut -d '"' -f 4 | head -n1)
          if [ -z "$LATEST_URL" ]; then
            LATEST_URL="https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-aarch64.dmg"
          fi
          echo "Downloading: $LATEST_URL"
          curl -L -o /tmp/rustdesk.dmg "$LATEST_URL"
          
          # Mount dan pasang RustDesk.app ke /Applications
          hdiutil attach /tmp/rustdesk.dmg -mountpoint /Volumes/RustDesk -nobrowse -quiet
          sudo cp -R /Volumes/RustDesk/RustDesk.app /Applications/
          hdiutil detach /Volumes/RustDesk -quiet
          rm -f /tmp/rustdesk.dmg
          
          # Hapus karantina Gatekeeper
          sudo xattr -rd com.apple.quarantine /Applications/RustDesk.app 2>/dev/null || true
          
          echo "=== Mengonfigurasi Direct IP & Menjalankan RustDesk ==="
          # Aktifkan Direct IP & Whitelist Tailscale di konfigurasi RustDesk TOML
          for U in runner macuser; do
            PREF_DIR="/Users/$U/Library/Preferences/com.carriez.RustDesk"
            sudo -u $U mkdir -p "$PREF_DIR"
            python3 -c "import os; p='$PREF_DIR/RustDesk2.toml'; t=open(p).read() if os.path.exists(p) else ''; t=t.replace('[options]', '[options]\ndirect-server = \'Y\'\ndirect-access-port = \'21118\'\nwhitelist = \'100.64.0.0/10\'') if '[options]' in t else t+'\n[options]\ndirect-server = \'Y\'\ndirect-access-port = \'21118\'\nwhitelist = \'100.64.0.0/10\'\n'; open(p,'w').write(t)" 2>/dev/null || true
            sudo chown -R $U:staff "$PREF_DIR" 2>/dev/null || true
          done
          
          # Buka aplikasi RustDesk terlebih dahulu agar IPC daemon aktif
          sudo -u macuser open -a /Applications/RustDesk.app
          sleep 4
          
          echo "=== Mengonfigurasi Password Permanen RustDesk ==="
          # Set password permanen via IPC setelah RustDesk berjalan
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "${USER_PASS}"
          
          # Auto-approve dialog izin Screen Recording macOS 15 Sequoia (UserNotificationCenter)
          sleep 2
          for i in {1..5}; do
            sudo -u runner osascript -e 'tell application "System Events" to tell process "UserNotificationCenter" to repeat with w in windows to try to click button "Allow" of w to end try to end repeat' 2>/dev/null || true
            sudo -u macuser osascript -e 'tell application "System Events" to tell process "UserNotificationCenter" to repeat with w in windows to try to click button "Allow" of w to end try to end repeat' 2>/dev/null || true
            sleep 2
          done

      - name: Sesi Siap Digunakan
        run: |
          echo "=========================================================="
          echo "              SESI RUNNER MACOS SIAP                      "
          echo "=========================================================="
          echo "IP Tailscale      : ${{ env.TAILSCALE_IP }}"
          echo "Akun Admin macOS  : macuser"
          echo "Status Keamanan   : Tailnet Private Mesh Only (IP 100.x.y.z)"
          echo "----------------------------------------------------------"
          echo "1. RustDesk GUI   : Masukkan Direct IP -> ${{ env.TAILSCALE_IP }}"
          echo "                    (Gunakan password yang Anda input saat trigger)"
          echo "----------------------------------------------------------"
          echo "2. VS Code (SSH)  : Host: mac-runner (0ms Lag)"
          echo "3. Web GUI noVNC  : http://${{ env.TAILSCALE_IP }}:6080/vnc.html"
          echo "=========================================================="

      - name: Keep-Alive Loop with Heartbeat
        env:
          HOURS: ${{ github.event.inputs.session_hours }}
        run: |
          TOTAL_SECONDS=$(( HOURS * 3600 ))
          ELAPSED=0
          INTERVAL=180
          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            # Trigger auto-approver & supresi popup
            /usr/local/bin/auto-approve-keychain 2>/dev/null || true
            sudo -u runner osascript -e 'tell application "System Events" to tell process "UserNotificationCenter" to repeat with w in windows to try to click button "Allow" of w to end try to end repeat' 2>/dev/null || true
            sudo -u macuser osascript -e 'tell application "System Events" to tell process "UserNotificationCenter" to repeat with w in windows to try to click button "Allow" of w to end try to end repeat' 2>/dev/null || true
            sudo killall -9 ReportCrash 2>/dev/null || true

            sleep $INTERVAL
            ELAPSED=$(( ELAPSED + INTERVAL ))
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            echo "[$(date -u +'%H:%M:%SZ')] Worker heartbeat: Sesi aktif. Sisa waktu: ${REMAINING} menit."
            caffeinate -u -t 1 || true
          done
